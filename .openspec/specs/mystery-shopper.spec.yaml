title: "Agentic mystery shopper"
slug: "mystery-shopper"
type: feature
status: review

author: "arananet"
created_at: "2026-09-23"
updated_at: "2026-09-23"

description: |
  Walks a shop's purchase journey in real headless Chromium the way a browsing
  agent would, acting only through ARIA roles and accessible names: dismiss
  overlays, choose a variant, add to cart, verify a machine-readable cart signal,
  reach checkout, inspect form autocomplete coverage and guest checkout, and
  measure price drift. It never types into forms and never presses a pay /
  place-order control: the payment boundary is where it stops and reports.
  Cookie banners are dismissed with reject / dismiss-only controls when present;
  accept-all is a fallback that grants consent. The payment boundary is best-effort
  (regex on accessible names) backed by the absence of any form-filling tool.
  The same capability is exposed to Muse Code as stepwise MCP tools with the
  same payment guard, so the agent can drive the journey itself.

acceptance_criteria:
  - "Given a shop with a cookie overlay, a labeled variant select, an add-to-cart button with an aria-live confirmation, a cart and a checkout, when the journey runs, then every step up to the payment boundary is reported as passed"
  - "Given the journey reaches a Pay / Place order control, when it runs, then that control is never clicked"
  - "Given checkout inputs without autocomplete tokens, when inspected, then autocomplete coverage is reported below 100% with the missing fields named"
  - "Given a checkout total higher than the product price (tax, shipping), when the journey runs, then price drift is informational: passed, with both amounts and the delta in the detail"
  - "Given a checkout total below the product price beyond a 0.01 tolerance, when the journey runs, then the price-drift step fails"
  - "Given a cookie banner offering both reject and accept, when overlays are dismissed, then reject / dismiss-only is preferred and accept-all is only a fallback"
  - "Given a cart/checkout control that neither navigates nor reaches checkout, when walking to checkout, then the walk stops with 'loop detected' instead of re-clicking"
  - "Given shop_click lands on a page exposing payment inputs, when the view is returned, then it carries a payment-inputs warning"
  - "Given an add-to-cart that gives no machine-readable feedback, when clicked, then the cart-signal step fails"
  - "Given a checkout that requires a password with no guest option, when inspected, then a login wall is reported"
  - "Given the MCP tools shop_open, shop_view, shop_click and shop_select, when Muse drives a session, then state persists across calls and shop_click refuses payment controls"
  - "Given --journey [--trace file], when the CLI runs, then the journey report is printed and a Playwright trace is written"

test_plan:
  - "Integration: local fixture shop (PDP, cart, checkout) served over HTTP, journey in real Chromium, server asserts the pay endpoint was never hit"
  - "Integration: fixture variants for silent add-to-cart and login-wall checkout"
  - "Integration: fixture variants for negative drift, reject-vs-accept cookie banner, looping cart link"
  - "Integration: MCP stepwise tools over a stdio pipe, including refused payment click"

out_of_scope:
  - "Typing personal or payment data into forms"
  - "Placing real orders"

