title: "Muse commerce auditor"
slug: "muse-commerce-auditor"
type: feature
status: review

author: "arananet"
created_at: "2026-09-23"
updated_at: "2026-09-23"

description: |
  A CLI that loads a shop URL in real headless Chromium (Playwright) and reports
  whether an AI shopping agent such as Meta Muse can discover, understand and act
  on the page without the Universal Commerce Protocol: crawler access in
  robots.txt, bot walls, schema.org Product/Offer data, server-rendered content,
  accessible purchase controls, and price consistency. An optional --muse mode
  hands the collected evidence to a real Muse Code agent through the official
  @muse-code/sdk (developer preview) and prints its assessment. Checks are
  heuristics derived from public web standards; Meta has not published the rules
  its consumer agent applies. The tool measures readiness for standards-following
  shopping agents; the Muse Code verdict is a second opinion from a frontier
  agent, not the consumer shopping product's verdict.

acceptance_criteria:
  - "Given a product page with valid Product JSON-LD, an accessible add-to-cart button and allowed crawlers, when audited, then no error findings are reported and the score is 100"
  - "Given a page whose product data only exists after JavaScript runs, when audited, then a warning reports that the no-JS render lacks product data"
  - "Given a robots.txt that disallows meta-externalagent or meta-externalfetcher, when audited, then an error finding names that user agent"
  - "Given a robots.txt that disallows only facebookexternalhit or FacebookBot, when audited, then the finding is a warning, not an error"
  - "Given a bare HTTP 503 without challenge markers, when audited, then the page is retried once before reporting 'HTTP 503 (transient or bot protection; retried once)'"
  - "Given a purchase control without an accessible name, when audited, then an error reports that no accessible add-to-cart/buy control exists"
  - "Given --json, when audited, then the report is printed as machine-readable JSON"
  - "Given the commerce_audit MCP server over stdio, when tools/list and tools/call agent_view are sent, then it returns read-only tools and the page's real Chromium ARIA snapshot, status and purchase controls"
  - "Given --muse and a muse binary in a trusted workspace, when audited, then a Muse Code session (via @muse-code/sdk) invokes the agentic-commerce-audit skill, only mcp__commerce_audit__ tools are approved, all else is denied, and the agent reply is printed"
  - "Given --muse without the skill loaded, when audited, then the CLI explains that the workspace must be trusted"

test_plan:
  - "Integration: robots severity per user agent and 503 retry against the local fixture server"
  - "Unit: robots.txt parser applies longest-match allow/disallow per user agent"
  - "Integration: audit real fixture pages served by a local HTTP server in real Chromium for each acceptance scenario"
  - "Integration: drive the MCP server over a stdio pipe against a local shop page"
  - "Unit: approval policy approves only commerce_audit MCP tools once and denies the rest"
  - "Manual: run --muse against a real muse binary (not available in CI)"

out_of_scope:
  - "Universal Commerce Protocol endpoints"
  - "Completing real purchases or submitting checkout forms"

